<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Non Stop · Reservá tu mesa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1 class="hero__title">¿Querés reservar tu mesa?</h1>
    <p class="hero__subtitle">Elegí tu mesa en el mapa y mirá la info al instante</p>
    <p class="api-status" id="apiStatus">Conectando con disponibilidad...</p>
    <div class="hero__tools">
      <button type="button" id="btnEdit" class="tool-btn" title="Recalibrar posiciones del mapa">⚙ Editar mapa</button>
      <a class="tool-btn tool-btn--link" href="admin.html">Admin</a>
    </div>
  </header>

  <main class="mapa-wrap">
    <div class="mapa" id="mapa">
      <img src="Mapas-limpio.jpg" alt="Plano del piso de Non Stop" class="mapa__img" id="mapaImg" />
      <div class="mapa__hotspots" id="hotspots"></div>
    </div>
  </main>

  <section class="info-mesa" id="info-mesa">
    <div class="info-mesa__content" id="infoMesaContent">
      <p class="info-mesa__placeholder">Elegí una mesa en el mapa para ver toda la información acá.</p>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
